<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Raise App (version 7)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{ --stage:#EFE6DC; --ink:#2A2233; --plum:#4A2C5A; --quiet:#6B6375; --card:#FFFFFF; --font:'Plus Jakarta Sans',system-ui,sans-serif; color-scheme:light; }
/* layout: the v7 phone (390 x 844) centred and scaled to fit; a screen list beside it on wide windows */
html,body{height:100%;margin:0}
body{background:var(--stage);font-family:var(--font);color:var(--ink);display:flex;align-items:center;justify-content:center;gap:28px;overflow:hidden}
#phone{width:390px;height:844px;position:relative;flex:none;border-radius:32px;overflow:hidden;box-shadow:0 20px 50px rgba(42,34,51,.22);transform-origin:center center;background:#FFF8F0}
.screen{position:absolute;inset:0}
.screen[hidden]{display:none}
.screen a{cursor:pointer}
.screen button:focus-visible,.screen a:focus-visible,.screen input:focus-visible{outline:3px solid #F4A261;outline-offset:2px}
#toast{position:absolute;left:16px;right:16px;bottom:96px;z-index:50;background:var(--ink);color:#fff;border-radius:18px;padding:14px 16px;font-size:15px;line-height:1.4;box-shadow:0 8px 20px rgba(42,34,51,.25);opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
.scroller{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;scrollbar-width:none}
.scroller::-webkit-scrollbar,.hscroll::-webkit-scrollbar{display:none}
.hscroll{overflow-x:auto!important;scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity;overscroll-behavior-x:contain}
.hscroll>*{scroll-snap-align:start}
#phone [data-topic]{cursor:pointer}
#index{width:260px;max-height:844px;overflow-y:auto;background:var(--card);border-radius:20px;padding:14px;box-sizing:border-box;align-self:center}
#index h2{font-size:16px;margin:4px 6px 4px}
#index p{font-size:13px;color:var(--quiet);margin:0 6px 10px;line-height:1.4}
#index button{display:block;width:100%;text-align:left;border:0;background:none;font:500 14px var(--font);color:var(--ink);padding:7px 8px;border-radius:10px;cursor:pointer}
#index button[aria-current="true"]{background:#FDEBDD;color:var(--plum);font-weight:700}
#index button:hover{background:#F6EFE7}
/* lines a parent can say aloud look like chat bubbles */
.say{position:relative;background:#F4ECFA!important;box-shadow:none!important;border-radius:22px 22px 22px 6px!important}
.say::after{content:"";position:absolute;left:14px;bottom:-9px;border-width:10px 12px 0 0;border-style:solid;border-color:#F4ECFA transparent transparent transparent}
.say-label{display:flex;align-items:center;gap:6px}
.say.pop{animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(.96);opacity:.4}100%{transform:scale(1);opacity:1}}
/* first lines: swipe between three */
.fl-row{flex-shrink:0;display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 12px;scrollbar-width:none}
.fl-row::-webkit-scrollbar{display:none}
.fl-card{flex:0 0 82%;scroll-snap-align:start;box-sizing:border-box;border-radius:22px 22px 22px 6px;padding:12px 14px;font-size:16px;line-height:1.4;background:#FFFFFF;box-shadow:inset 0 0 0 1px #E8DFD3;cursor:pointer;color:#2A2233;outline:none}
.fl-card.on{background:#F4ECFA;box-shadow:inset 0 0 0 2px #4A2C5A}
.fl-card small{display:block;font-size:12px;font-weight:700;color:#6B6375;margin-bottom:4px}
/* WhatsApp warm-up: its own green card */
.wa-card{flex-shrink:0;margin-top:10px;background:#E8F8EE;border-radius:20px;padding:12px 12px 14px;box-shadow:inset 0 0 0 1px #BFE8CD}
.wa-card .fl-card{background:#FFFFFF;box-shadow:inset 0 0 0 1px #CFEBD9}
.wa-card .fl-card.on{background:#DCF8C6;box-shadow:inset 0 0 0 2px #1FA855}
.wa-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:48px;border:none;border-radius:24px;background:#1FA855;color:#fff;font:700 16px var(--font);cursor:pointer;margin-top:4px}
.wa-row{background:#E8F8EE!important;border-radius:16px;padding:6px 10px!important;margin-top:6px}
/* reflection: a small celebration with the next topic */
#celebrate{position:absolute;left:12px;right:12px;bottom:88px;z-index:40;background:#FFFFFF;border-radius:24px;box-shadow:0 14px 40px rgba(42,34,51,.28);padding:16px;animation:rise .35s ease-out}
@keyframes rise{0%{transform:translateY(30px);opacity:0}100%{transform:none;opacity:1}}
@media (max-width:760px){ #index{display:none} body{gap:0} }
@media (prefers-reduced-motion:reduce){ #toast{transition:none} .say.pop,#celebrate{animation:none} }
</style>
</head>
<body>
<aside id="index" aria-label="All screens">
  <h2>Raise · version 7</h2>
  <p>A working build of the 45 v7 screens. Tap through the phone, or jump to any screen here.</p>
  <!--INDEX-->
</aside>
<div id="phone">
<!--SCREENS-->
<div id="toast" role="status" aria-live="polite"></div>
</div>
<script>
/*APPJS*/
</script>
</body>
</html>
