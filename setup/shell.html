<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Raise App (version 7)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{ --stage:#EFE6DC; --ink:#2A2233; --plum:#4A2C5A; --quiet:#6B6375; --card:#FFFFFF; --font:'Plus Jakarta Sans',system-ui,sans-serif; color-scheme:light; }
/* layout: the v7 phone (390 x 844) centred and scaled to fit; a screen list beside it on wide windows */
html,body{height:100%;margin:0}
body{background:var(--stage);font-family:var(--font);color:var(--ink);display:flex;align-items:center;justify-content:center;gap:28px;overflow:hidden}
#phone{width:390px;height:844px;position:relative;flex:none;border-radius:32px;overflow:hidden;box-shadow:0 20px 50px rgba(42,34,51,.22);transform-origin:center center;background:#FFF8F0}
.screen{position:absolute;inset:0}
.screen[hidden]{display:none}
.screen a{cursor:pointer}
.screen button:focus-visible,.screen a:focus-visible,.screen input:focus-visible{outline:3px solid #F4A261;outline-offset:2px}
#toast{position:absolute;left:16px;right:16px;bottom:96px;z-index:50;background:var(--ink);color:#fff;border-radius:18px;padding:14px 16px;font-size:15px;line-height:1.4;box-shadow:0 8px 20px rgba(42,34,51,.25);opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
.scroller{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;scrollbar-width:none}
.scroller::-webkit-scrollbar,.hscroll::-webkit-scrollbar{display:none}
.hscroll{overflow-x:auto!important;scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity;overscroll-behavior-x:contain}
.hscroll>*{scroll-snap-align:start}
#phone [data-topic]{cursor:pointer}
#index{width:260px;max-height:844px;overflow-y:auto;background:var(--card);border-radius:20px;padding:14px;box-sizing:border-box;align-self:center}
#index h2{font-size:16px;margin:4px 6px 4px}
#index p{font-size:13px;color:var(--quiet);margin:0 6px 10px;line-height:1.4}
#index button{display:block;width:100%;text-align:left;border:0;background:none;font:500 14px var(--font);color:var(--ink);padding:7px 8px;border-radius:10px;cursor:pointer}
#index button[aria-current="true"]{background:#FDEBDD;color:var(--plum);font-weight:700}
#index button:hover{background:#F6EFE7}
/* lines a parent can say aloud look like chat bubbles */
.say{position:relative;background:#F4ECFA!important;box-shadow:none!important;border-radius:22px 22px 22px 6px!important}
.say::after{content:"";position:absolute;left:14px;bottom:-9px;border-width:10px 12px 0 0;border-style:solid;border-color:#F4ECFA transparent transparent transparent}
.say-label{display:flex;align-items:center;gap:6px}
.say.pop{animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(.96);opacity:.4}100%{transform:scale(1);opacity:1}}
/* first lines: swipe between three */
.fl-row{flex-shrink:0;display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 12px;scrollbar-width:none}
.fl-row::-webkit-scrollbar{display:none}
.fl-card{backdrop-filter:blur(10px);flex:0 0 82%;scroll-snap-align:start;box-sizing:border-box;border-radius:22px 22px 22px 6px;padding:12px 14px;font-size:16px;line-height:1.4;background:#FFFFFF;box-shadow:inset 0 0 0 1px #E8DFD3;cursor:pointer;color:#2A2233;outline:none}
.fl-card.on{background:#F4ECFA;box-shadow:inset 0 0 0 2px #4A2C5A}
.fl-card small{display:block;font-size:12px;font-weight:700;color:#6B6375;margin-bottom:4px}
/* WhatsApp warm-up: its own green card */
.wa-card{flex-shrink:0;margin-top:10px;background:linear-gradient(160deg,rgba(236,250,242,.75),rgba(255,255,255,.6));-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.85);border-radius:20px;padding:12px 12px 14px;box-shadow:0 8px 24px rgba(31,122,77,.08)}
.wa-card .fl-card{background:#FFFFFF;box-shadow:inset 0 0 0 1px #CFEBD9}
.wa-card .fl-card.on{background:#E3F6EA;box-shadow:inset 0 0 0 2px #2FA36B}
.wa-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:48px;border:none;border-radius:24px;background:linear-gradient(135deg,#34C27A,#1E9A5A);color:#fff;font:700 16px var(--font);cursor:pointer;margin-top:4px;box-shadow:0 6px 16px rgba(30,154,90,.25)}
.wa-row{background:rgba(236,250,242,.7)!important;border:1px solid rgba(255,255,255,.85)!important;border-radius:16px;padding:6px 10px!important;margin-top:6px}
/* ---- design pass 15 Nov: glass surfaces, one button language, clear status colours ---- */
.glass{background:rgba(255,255,255,.62)!important;-webkit-backdrop-filter:blur(16px) saturate(140%);backdrop-filter:blur(16px) saturate(140%);border:1px solid rgba(255,255,255,.8);box-shadow:0 8px 24px rgba(74,44,90,.08)!important}
.ic{flex:none;display:inline-block;vertical-align:-3px}
/* lesson toolbar: three equal tiles, icon above a one-word label */
.tb{display:grid!important;grid-template-columns:repeat(4,1fr);gap:8px;padding:8px;border-radius:22px;margin-top:14px!important}
.tb button{height:60px!important;width:100%;flex-direction:column!important;justify-content:center!important;align-items:center!important;gap:3px!important;border-radius:16px!important;font-size:13px!important;font-weight:700!important;padding:0 4px!important;background:rgba(255,255,255,.75)!important;color:#4A2C5A!important;margin:0!important;white-space:nowrap}
.tb .tb-ask{background:#EFE6FA!important;color:#5B3A8C!important}
.tb .tb-next{background:#FDE7D6!important;color:#9A4A16!important}
.ready-gap{margin-top:16px!important}
.ch-chip{display:inline-flex!important;align-self:flex-start;width:auto!important;background:#EFE6FA;color:#5B3A8C!important;border-radius:12px;padding:3px 10px;font-size:12.5px!important;font-weight:700!important}
.ch-end{display:flex;align-items:center;gap:10px;margin:18px 0 6px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#9A8FA6}
.ch-end::before,.ch-end::after{content:"";flex:1;height:1px;background:#E6DCEB}
/* buttons: filled = main action, outline = secondary, red outline = remove */
.btn-f,.btn-o{display:inline-flex!important;align-items:center;justify-content:center;gap:6px;height:42px!important;padding:0 16px!important;border-radius:21px!important;font:700 15px var(--font)!important;cursor:pointer;white-space:nowrap}
.btn-f{background:#4A2C5A!important;color:#FFFFFF!important;border:none!important;box-shadow:0 4px 12px rgba(74,44,90,.22)}
.btn-o{background:rgba(255,255,255,.7)!important;color:#4A2C5A!important;border:1.5px solid #4A2C5A!important}
.btn-danger{color:#B83A3A!important;border-color:#E3A3A3!important}
.btn-center{align-self:center;margin:14px auto 0!important}
/* section headings */
.sec-h{font-size:17px!important;font-weight:700!important;color:#2A2233!important;margin:22px 0 6px!important;display:flex;align-items:center;gap:8px}
.lab-ic{display:flex!important;align-items:center;gap:6px}
/* chevrons turn when a section opens */
.chev{transition:transform .2s ease}
details[open] .chev,[aria-expanded=true] .chev{transform:rotate(180deg)}
details summary{list-style:none}
details summary::-webkit-details-marker{display:none}
/* My topics status colours */
.st{display:flex!important;align-items:center;gap:5px;font-weight:600}
.st-done{color:#1F7A4D!important}
.st-plan{color:#C23B3B!important}
.st-go{color:#B45309!important}
.st-next{color:#5B3A8C!important}
.st-saved{color:#6B6375!important}
/* reflection: while the celebration is open, the page does not repeat "Next for you" */
.celebrating [data-b=rfnextblk]{display:none!important}
/* the line bubble on the player keeps one height, so the controls never move */
#s-Player .say{height:184px;box-sizing:border-box;overflow-y:auto;overscroll-behavior:contain}
.wa-toggle{background:linear-gradient(160deg,rgba(236,250,242,.8),rgba(255,255,255,.6))!important}
.wa-share{width:100%;height:48px!important}

/* ================= BETA 2 THEME: warm minimal + a touch of glass (body.t2) =================
   one family of colours: plum = act, peach = say/highlight, glass white = surfaces,
   status colours only as small text, WhatsApp green only on its icon */
body.t2 #phone{background:linear-gradient(180deg,#FFF8F0 0%,#FBEDE4 58%,#F5E8EC 100%)}
body.t2 .screen>div{background-color:transparent!important}
body.t2 #s-Read>div{background:#FFF8F0!important}
body.t2 .screen [style*="background: #FFFFFF"]:not(button){background:rgba(255,255,255,.78)!important;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 6px 20px rgba(74,44,90,.07),inset 0 0 0 1px rgba(255,255,255,.85)!important}
body.t2 .glass{background:rgba(255,255,255,.72)!important}
/* say = peach */
body.t2 .screen .say.say,body.t2 .say{background:rgba(253,235,221,.94)!important;box-shadow:none!important}
body.t2 .say::after{border-color:rgba(253,235,221,.92) transparent transparent transparent}
body.t2 .fl-card{background:rgba(255,255,255,.8);box-shadow:inset 0 0 0 1px rgba(232,223,211,.9)}
body.t2 .fl-card.on{background:#FDEBDD;box-shadow:inset 0 0 0 2px #4A2C5A}
body.t2 .ch-chip{background:#FDEBDD;color:#7A3E1A!important}
/* toolbar: four equal glass tiles; only Next is peach */
body.t2 .tb button{background:rgba(255,255,255,.82)!important;color:#4A2C5A!important}
body.t2 .tb .tb-ask{background:rgba(255,255,255,.82)!important;color:#4A2C5A!important}
body.t2 .tb .tb-next{background:#FDEBDD!important;color:#4A2C5A!important}
/* WhatsApp: glass surfaces, plum outline buttons, green only on the icon */
body.t2 .wa-toggle{background:rgba(255,255,255,.75)!important}
body.t2 .wa-toggle span span:last-child{color:#6B6375!important}
body.t2 .wa-card{background:rgba(255,255,255,.7)!important;box-shadow:0 6px 20px rgba(74,44,90,.07)!important}
body.t2 .wa-card .fl-card{background:rgba(255,255,255,.88);box-shadow:inset 0 0 0 1px rgba(232,223,211,.9)}
body.t2 .wa-card .fl-card.on{background:#FDEBDD;box-shadow:inset 0 0 0 2px #4A2C5A}
body.t2 .wa-btn{background:rgba(255,255,255,.75)!important;color:#4A2C5A!important;border:1.5px solid #4A2C5A!important;box-shadow:none!important}
body.t2 .wa-btn svg path{fill:#25D366}
body.t2 .wa-card [data-b=sparkhint]{color:#6B6375!important}
body.t2 .wa-card>div:first-child{color:#4A2C5A!important}
/* buttons */
body.t2 .btn-o{background:rgba(255,255,255,.72)!important;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
/* status: muted, warm-compatible */
body.t2 .st-done{color:#2F7D57!important} body.t2 .st-plan{color:#C2453D!important} body.t2 .st-go{color:#B7791F!important}
@media (prefers-reduced-transparency:reduce){ body.t2 .glass, body.t2 .screen [style*="background: #FFFFFF"]{-webkit-backdrop-filter:none;backdrop-filter:none;background:#FFFFFF!important} }
/* reflection: a small celebration with the next topic */
#celebrate{position:absolute;left:12px;right:12px;bottom:88px;z-index:40;background:rgba(255,255,255,.88);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.9);border-radius:24px;box-shadow:0 14px 40px rgba(42,34,51,.28);padding:16px;animation:rise .35s ease-out}
@keyframes rise{0%{transform:translateY(30px);opacity:0}100%{transform:none;opacity:1}}
@media (max-width:760px){ #index{display:none} body{gap:0} }
@media (prefers-reduced-motion:reduce){ #toast{transition:none} .say.pop,#celebrate{animation:none} }
</style>
</head>
<body>
<aside id="index" aria-label="All screens">
  <h2>Raise · version 7</h2>
  <p>A working build of the 45 v7 screens. Tap through the phone, or jump to any screen here.</p>
  <!--INDEX-->
</aside>
<div id="phone">
<!--SCREENS-->
<div id="toast" role="status" aria-live="polite"></div>
</div>
<script>
/*APPJS*/
</script>
</body>
</html>
